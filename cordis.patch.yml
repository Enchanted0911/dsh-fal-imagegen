# dsh-fal-imagegen bundle patch: inserts the plugin row into the web profile
# roster. The row is a bare plugin by package name; the node half (exports ".")
# runs in the host process and owns the fal settings section, the fal.ai client
# and the Agent image tools (async generate + task query + sync edit). The
# browser half (exports "./client") renders the bilingual settings card.
- insert:
    - id: fal-imagegen
      name: 'dsh-fal-imagegen'
